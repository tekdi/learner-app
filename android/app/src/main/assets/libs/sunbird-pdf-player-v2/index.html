<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>

  <!-- 1. The custom element -->
  <content-player id="player"></content-player>
<script>
  window.onerror = function(msg, src, line, col, err) {
    document.body.innerHTML = '<pre style="color:red;padding:10px">' 
      + 'JS ERROR:\n' + msg + '\n' + src + ':' + line + '</pre>';
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'error', msg, src, line }));
    }
    return false;
  };
</script>
  <!-- 2. Load the self-contained IIFE bundle (auto-registers the element) -->
  <script src="content-player.iife.js"></script>
<script>
  if (!customElements.get('content-player')) {
    document.body.innerHTML = '<pre style="color:red;padding:10px">IIFE NOT LOADED — content-player.iife.js missing or failed</pre>';
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'error', msg: 'IIFE not loaded' }));
    }
  } else {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'debug', msg: 'IIFE loaded OK' }));
    }
  }
</script>

  <script>
    function setData(playerConfigtemp) 
      {
const playerConfig=JSON.parse(playerConfigtemp);
    const player = document.getElementById('player');
    // window.alert(playerConfig);

    // 3. Pass the Sunbird-compatible config as a JS property
    player.sunbirdPlayerConfig = playerConfig;
    // player.sunbirdPlayerConfig = playerConfig;
/*if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(
  JSON.stringify({ type: 'debug', msg: 'setData called', 
    artifactUrl: (playerConfig.metadata || {}).artifactUrl,
    hasMetadata: !!playerConfig.metadata,
    metadataKeys: Object.keys(playerConfig.metadata || {})
  })
);*/

    // 4. Optional: enable resume from last page
    player.extra = {
      resume: {
        enabled: true,
        mode: "off"   // "auto" | "prompt" | "off"
      },
      theme: {
        primary:    "#ff0000",   // accent colour: buttons, progress bar, active states
        toolbar:    "#000000",  // toolbar background
        // background: "#ffffff",   // PDF viewer / page area background
      }
    };

    // ── 5. Listen to telemetry / lifecycle events ─────────────────────────

    function rnPost(type, detail) {
      var payload = JSON.stringify({ type: type, detail: detail });
      console.log('[player-event]', payload);
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(payload);
    }

    player.addEventListener('player:ready',    function(e) { rnPost('player:ready', e.detail); });
    player.addEventListener('player:start',    function(e) { rnPost('player:start', e.detail); });
    player.addEventListener('player:progress', function(e) { rnPost('player:progress', e.detail); });
    player.addEventListener('player:complete', function(e) { rnPost('player:complete', e.detail); });
    player.addEventListener('player:endscreen',function(e) { rnPost('player:endscreen', e.detail); });
    player.addEventListener('player:error',    function(e) { rnPost('player:error', e.detail); });
    player.addEventListener('player:close',    function(e) { rnPost('player:close', e.detail); });
    
    player.addEventListener('playerTelemetryEvent', function (e) {
    const envelope = e.detail;   // full SunbirdTelemetryEvent object
    console.log('[telemetry]', envelope.eid, envelope);

    // envelope shape:
    // {
    //   eid:     "START" | "INTERACT" | "IMPRESSION" | "HEARTBEAT" | "ERROR" | "END",
    //   ets:     1713870000000,        ← epoch timestamp ms
    //   ver:     "3.0",
    //   mid:     "START:a3f9c1...",    ← unique event ID
    //   actor:   { id: "user-123", type: "User" },
    //   context: { channel, pdata, sid, did, cdata, rollup, uid },
    //   object:  { id: "do_21443...", ver: "1", type: "Content", rollup: {} },
    //   edata:   { /* event-specific payload — see Telemetry Events Reference */ }
    // }
  });
}
  </script>

</body>
</html>
